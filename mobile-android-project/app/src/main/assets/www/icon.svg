<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a0e17" />
      <stop offset="50%" stop-color="#2d0a10" />
      <stop offset="100%" stop-color="#140407" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Wine Bottle -->
  <g transform="translate(140, 70)">
    <!-- Bottle neck -->
    <path d="M 64 20 L 76 20 L 76 80 L 86 110 L 86 310 L 14 310 L 14 110 L 24 80 L 24 20 Z" fill="url(#gold)" opacity="0.95" />
    <!-- Cap -->
    <rect x="58" y="10" width="24" height="14" rx="3" fill="#fef3c7" />
    <!-- Foil line -->
    <rect x="62" y="32" width="16" height="4" fill="#78350f" />
    <!-- Bottle Label -->
    <rect x="22" y="150" width="56" height="85" rx="6" fill="#fef3c7" />
    <path d="M 28 170 L 72 170 M 34 185 L 66 185 M 38 200 L 62 200" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Wine Glass & Register Motif -->
  <g transform="translate(240, 150)">
    <!-- Wine Glass Bowl -->
    <path d="M 40 40 Q 40 120 80 120 Q 120 120 120 40 Z" fill="url(#gold)" opacity="0.85" />
    <path d="M 46 50 Q 80 110 114 50" fill="none" stroke="#fef3c7" stroke-width="3" opacity="0.6" />
    <!-- Stem -->
    <rect x="76" y="120" width="8" height="90" rx="4" fill="url(#gold)" />
    <!-- Base -->
    <ellipse cx="80" cy="215" rx="36" ry="9" fill="url(#gold)" />
  </g>

  <!-- Till / POS Symbol at base -->
  <g transform="translate(96, 380)">
    <rect x="0" y="0" width="320" height="52" rx="14" fill="#1e1310" stroke="url(#gold)" stroke-width="2" />
    <circle cx="40" cy="26" r="8" fill="#10b981" />
    <text x="64" y="33" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="3">CELLAR POS</text>
    <rect x="250" y="16" width="46" height="20" rx="4" fill="#374151" />
    <text x="256" y="30" fill="#9ca3af" font-family="monospace" font-size="11">KSh</text>
  </g>
</svg>
